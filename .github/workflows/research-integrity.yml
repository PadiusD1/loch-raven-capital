name: Research integrity checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  research-integrity:
    if: github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      LOCH_RAVEN_AUTO_RESEARCH: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile research modules
        run: python -m compileall -q firm scripts tests
      - name: Run targeted regression tests
        run: |
          mkdir -p /tmp/research-validation
          python -m unittest discover -s tests -p 'test_memory_direction.py' 2>&1 | tee /tmp/research-validation/direction.txt
          python -m unittest discover -s tests -p 'test_research*.py' 2>&1 | tee /tmp/research-validation/research.txt
          python -m unittest discover -s tests -p 'test_desk_research_integration.py' 2>&1 | tee /tmp/research-validation/desk-integration.txt
      - name: Run existing institutional-memory suite
        run: python tests/test_memory.py 2>&1 | tee /tmp/research-validation/memory.txt
      - name: Run firm regression suite
        run: python tests/test_firm.py 2>&1 | tee /tmp/research-validation/firm.txt
      - name: Run simulated trading week
        run: python tests/test_week_sim.py 2>&1 | tee /tmp/research-validation/week.txt
      - name: Evaluate populated source corpus
        run: python -m scripts.evaluate_research 2>&1 | tee /tmp/research-validation/retrieval.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research-validation-${{ github.sha }}
          path: |
            /tmp/research-validation/
            data/research_evaluation/retrieval_evaluation.json
          retention-days: 3
