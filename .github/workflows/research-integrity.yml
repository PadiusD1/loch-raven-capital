name: Research integrity checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  research-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Capture exact tested source
        run: git archive --format=tar -o /tmp/loch-raven-source.tar HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: research-source-snapshot
          path: /tmp/loch-raven-source.tar
          retention-days: 7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile research modules
        run: python -m compileall -q firm scripts tests
      - name: Run targeted regression tests
        run: |
          python -m unittest discover -s tests -p 'test_memory_direction.py'
          python -m unittest discover -s tests -p 'test_research_provenance.py'
          python -m unittest discover -s tests -p 'test_research_rag.py'
          python -m unittest discover -s tests -p 'test_desk_research_integration.py'
      - name: Run existing institutional-memory suite
        run: python tests/test_memory.py
      - name: Run firm regression suite
        run: python tests/test_firm.py
      - name: Run simulated trading week
        run: python tests/test_week_sim.py
