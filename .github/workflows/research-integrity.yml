name: Research integrity checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  research-integrity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile modified research modules
        run: python -m py_compile firm/analysts.py firm/memory_rag.py firm/research_provenance.py
      - name: Run targeted regression tests
        run: |
          python tests/test_memory_direction.py
          python tests/test_research_provenance.py
      - name: Run existing institutional-memory suite
        run: python tests/test_memory.py
