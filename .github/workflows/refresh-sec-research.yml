name: Refresh SEC research dataset

on:
  workflow_dispatch:
  schedule:
    - cron: '20 12 * * 1-5'

permissions:
  contents: read

jobs:
  sec-research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install research dependencies
        run: python -m pip install httpx
      - name: Fetch SEC company facts for selected research universe
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          test -n "$SEC_USER_AGENT" || { echo 'Set SEC_USER_AGENT secret with organization and contact email'; exit 1; }
          python scripts/fetch_sec_research.py --cik 320193 --output data/research/apple-sec.json
          python scripts/fetch_sec_research.py --cik 789019 --output data/research/microsoft-sec.json
          python scripts/fetch_sec_research.py --cik 1018724 --output data/research/amazon-sec.json
      - name: Upload validated research files
        uses: actions/upload-artifact@v4
        with:
          name: sec-research-${{ github.run_id }}
          path: data/research/*.json
          retention-days: 30
