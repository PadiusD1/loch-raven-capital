name: Apply tested free-data automation
on:
  push:
    branches: [feat/free-data-automation]
    paths: ['.automation/free-data/**', '.github/workflows/apply-free-data.yml']
permissions:
  contents: read
jobs:
  validate-and-collect:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    env:
      PYTHONPATH: .
      OPENBLAS_NUM_THREADS: '1'
      OMP_NUM_THREADS: '1'
      LOCH_RAVEN_AUTO_RESEARCH: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Apply and stage exact audited source patch
        run: |
          mkdir -p /tmp/free-validation
          python - <<'PY'
          import base64, hashlib, lzma, pathlib, subprocess, json
          text = ''.join(p.read_text() for p in sorted(pathlib.Path('.automation/free-data').glob('*.b64')))
          patch = lzma.decompress(base64.b64decode(text, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '115614467d2bf26345aad26746b6498954c4e0cf8af4b44f20706bfe8c40455f'
          pathlib.Path('/tmp/free-data.patch').write_bytes(patch)
          subprocess.run(['git','apply','--check','--index','/tmp/free-data.patch'], check=True)
          subprocess.run(['git','apply','--index','/tmp/free-data.patch'], check=True)
          subprocess.run(['python','.automation/free-data/final-quality-fix.py'],check=True)
          paths=['firm/research_automation.py','firm/research_transport.py','scripts/free_source_collection.py','tests/test_research_automation.py']
          for path in paths:
              assert pathlib.Path(path).is_file(), 'Missing source: '+path
          subprocess.run(['git','add','-f','--']+paths,check=True)
          pathlib.Path('/tmp/free-validation/module-manifest.json').write_text(json.dumps({p:hashlib.sha256(pathlib.Path(p).read_bytes()).hexdigest() for p in paths},indent=2))
          PY
      - name: Install existing dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile and run research, direction and desk tests
        run: |
          python -c "import firm.research_automation, firm.research_transport; print(firm.research_automation.__file__, firm.research_transport.__file__)"
          python -m compileall -q firm scripts tests
          python -m unittest discover -s tests -p 'test_research*.py' 2>&1 | tee /tmp/free-validation/research.txt
          python -m unittest discover -s tests -p 'test_memory_direction.py' 2>&1 | tee /tmp/free-validation/direction.txt
          python -m unittest discover -s tests -p 'test_desk_research_integration.py' 2>&1 | tee /tmp/free-validation/desks.txt
      - name: Institutional memory regression
        run: python tests/test_memory.py 2>&1 | tee /tmp/free-validation/memory.txt
      - name: Full fund regression
        run: python tests/test_firm.py 2>&1 | tee /tmp/free-validation/firm.txt
      - name: Simulated trading week
        run: python tests/test_week_sim.py 2>&1 | tee /tmp/free-validation/week.txt
      - name: Collect expanded free-source universe
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
        run: |
          python -m scripts.refresh_research 2>&1 | tee /tmp/free-validation/collection.txt
          cp data/research_refresh_report.json /tmp/free-validation/first-collection.json
      - name: Measure cache reuse and populated-corpus retrieval
        run: |
          python -m scripts.refresh_research --report /tmp/free-validation/repeat-collection.json 2>&1 | tee /tmp/free-validation/repeat.txt
          python -m unittest discover -s tests -p 'test_research*.py' 2>&1 | tee /tmp/free-validation/research-populated.txt
          python -m scripts.evaluate_research 2>&1 | tee /tmp/free-validation/retrieval.txt
      - name: Persist exact approved source and data paths only
        run: |
          python - <<'PY'
          import pathlib, subprocess, hashlib, json
          manifest=json.loads(pathlib.Path('/tmp/free-validation/module-manifest.json').read_text())
          for path,digest in manifest.items():
              p=pathlib.Path(path)
              assert p.is_file(), 'Tested source disappeared: '+path
              assert hashlib.sha256(p.read_bytes()).hexdigest()==digest, 'Tested source changed: '+path
          paths=['.github/workflows/refresh-sec-research.yml','.github/workflows/research-integrity.yml','.gitignore','README.md','config.py','docs/FREE_DATA_AUTOMATION.md','firm/cycle.py','firm/data_engine.py','firm/memory_api.py','firm/research_automation.py','firm/research_provenance.py','firm/research_rag.py','firm/research_transport.py','scripts/fetch_sec_research.py','scripts/free_source_collection.py','scripts/refresh_research.py','tests/test_firm.py','tests/test_research_automation.py','tests/test_week_sim.py','data/research','data/research_evaluation','data/research_refresh_report.json']
          subprocess.run(['git','add','-f','--']+paths,check=True)
          subprocess.run(['git','-c','user.name=github-actions[bot]','-c','user.email=41898282+github-actions[bot]@users.noreply.github.com','commit','-m','Implement bounded fund-aware free-source automation with validated live data'],check=True)
          subprocess.run(['git','push','origin','HEAD:refs/heads/feat/free-data-automation'],check=True)
          subprocess.run(['git','archive','--format=zip','--output=/tmp/free-validation/tested-source.zip','HEAD'],check=True)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: free-data-validation
          path: |
            /tmp/free-validation/
            data/research_refresh_report.json
            data/research_evaluation/retrieval_evaluation.json
          retention-days: 7
