name: Free-source audit snapshot
on:
  push:
    branches: [feat/free-data-automation]
permissions:
  contents: read
jobs:
  source-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: git archive --format=zip --output=source.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: free-source-audit
          path: source.zip
          retention-days: 1
